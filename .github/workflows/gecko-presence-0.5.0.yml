name: Gecko Presence 0.5.0 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "GeckoPresence-Suite-0.5.0-Source.zip"
      - ".github/workflows/gecko-presence-0.5.0.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and Firefox XPI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Gecko Presence source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="GeckoPresence-Suite-0.5.0-Source.zip"
          test -f "$ARCHIVE" || {
            echo "::error::Missing $ARCHIVE at repository root."
            exit 1
          }
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/gpb-source"
          SOURCE_ROOT="$(find "$RUNNER_TEMP/gpb-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$SOURCE_ROOT" ]; then
            SOURCE_ROOT="$(find "$RUNNER_TEMP/gpb-source" -type d -name GeckoPresence-Suite-0.5.0 -print -quit)"
          fi
          test -n "$SOURCE_ROOT" && test -d "$SOURCE_ROOT"
          echo "GPB_SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "Source root: $SOURCE_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Verify and build extension
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_JSON="$(find "$GPB_SOURCE_ROOT" -path '*/node_modules' -prune -o -name package.json -print | grep -E '/(extension|GeckoPresenceBridge)/package.json$' | head -n 1 || true)"
          if [ -z "$PACKAGE_JSON" ]; then
            PACKAGE_JSON="$(find "$GPB_SOURCE_ROOT" -path '*/node_modules' -prune -o -name package.json -print | head -n 1)"
          fi
          test -n "$PACKAGE_JSON"
          EXT_DIR="$(dirname "$PACKAGE_JSON")"
          echo "Extension package: $EXT_DIR"
          cd "$EXT_DIR"
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run import:premid --if-present
          npm run build
          npm test --if-present
          if [ -x node_modules/.bin/web-ext ]; then
            node_modules/.bin/web-ext lint --source-dir .
          fi
          mkdir -p "$RUNNER_TEMP/gpb-output"
          find . -maxdepth 3 -type f -name '*.xpi' -exec cp {} "$RUNNER_TEMP/gpb-output/" \;
          if [ -f manifest.json ]; then
            zip -qr "$RUNNER_TEMP/gpb-output/GeckoPresenceBridge-0.5.0-unsigned.xpi" manifest.json .
          fi

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find "$GPB_SOURCE_ROOT" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::Gradle wrapper (gradlew) not found in source archive."
            exit 1
          fi
          GRADLE_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          cd "$GRADLE_DIR"
          "$GRADLEW" --no-daemon assembleDebug
          mkdir -p "$RUNNER_TEMP/gpb-output"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$RUNNER_TEMP/gpb-output/GeckoPresence-0.5.0-Android-debug.apk" \;

      - name: Generate checksums and build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gpb-output"
          test -n "$(find . -maxdepth 1 -type f -print -quit)"
          sha256sum * > SHA256SUMS.txt
          {
            echo "Gecko Presence 0.5.0"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Artifacts:"
            ls -lh
          } > BUILD-MANIFEST.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeckoPresence-0.5.0-build
          path: ${{ runner.temp }}/gpb-output/*
          if-no-files-found: error
          retention-days: 30

