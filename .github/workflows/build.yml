name: Gecko Presence 0.5.0 — Hybrid Android + Gecko Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
      DISCORD_SDK_AAR_PATH: ${{ vars.DISCORD_SDK_AAR_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Extract combined source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'GeckoPresence-Suite-0.5.0-Source.zip' | head -n 1)"
          if [[ -z "$ZIP_FILE" ]]; then echo 'GeckoPresence 0.5.0 source archive not found.' >&2; exit 1; fi
          rm -rf _gpb_work && mkdir -p _gpb_work
          unzip -q "$ZIP_FILE" -d _gpb_work
          HOST_DIR="$(find _gpb_work -mindepth 2 -maxdepth 6 -type d -name GeckoPresenceHost | head -n 1)"
          test -n "$HOST_DIR" && test -f "$HOST_DIR/settings.gradle.kts"
          SUITE_DIR="$(dirname "$HOST_DIR")"
          BRIDGE_DIR="$SUITE_DIR/GeckoPresenceBridge"
          test -f "$BRIDGE_DIR/package.json" && test -d "$BRIDGE_DIR/src"
          echo "host_dir=$HOST_DIR" >> "$GITHUB_OUTPUT"
          echo "bridge_dir=$BRIDGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical release version
        id: version
        working-directory: ${{ steps.source.outputs.bridge_dir }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "0.5.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Make official Discord SDK AAR available when configured
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR='${{ steps.source.outputs.host_dir }}'
          AAR_TARGET="$HOST_DIR/app/libs/discord_partner_sdk.aar"
          mkdir -p "$(dirname "$AAR_TARGET")"
          if [[ -n "$DISCORD_SDK_AAR_PATH" ]]; then
            AAR_SOURCE="$GITHUB_WORKSPACE/$DISCORD_SDK_AAR_PATH"
            test -f "$AAR_SOURCE"
            cp "$AAR_SOURCE" "$AAR_TARGET"
          elif [[ -f "$GITHUB_WORKSPACE/discord_partner_sdk.aar" ]]; then
            cp "$GITHUB_WORKSPACE/discord_partner_sdk.aar" "$AAR_TARGET"
          fi
          if [[ -f "$AAR_TARGET" && -n "$DISCORD_APP_ID" ]]; then echo 'SDK-enabled build configured.'; else echo 'Preview build: official Discord SDK AAR or Application ID is missing.'; fi

      - name: Install extension dependencies and import pinned PreMiD activity
        working-directory: ${{ steps.source.outputs.bridge_dir }}
        run: |
          npm install --no-audit --no-fund
          npm run import:premid
          npm test

      - name: Lint Gecko extension
        working-directory: ${{ steps.source.outputs.bridge_dir }}
        run: npx web-ext lint --source-dir extension

      - name: Bundle extension into Android assets and build XPI
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR='${{ steps.source.outputs.host_dir }}'
          BRIDGE_DIR='${{ steps.source.outputs.bridge_dir }}'
          VERSION='${{ steps.version.outputs.version }}'
          ASSET_DIR="$HOST_DIR/app/src/main/assets/gpb-extension"
          rm -rf "$ASSET_DIR" && mkdir -p "$ASSET_DIR"
          cp -a "$BRIDGE_DIR/extension/." "$ASSET_DIR/"
          (cd "$BRIDGE_DIR/extension" && zip -q -r "$GITHUB_WORKSPACE/GeckoPresenceBridge-${VERSION}-unsigned.xpi" .)
          test "$(node -p "require('$BRIDGE_DIR/package.json').version")" = "$VERSION"
          test "$(node -p "require('$ASSET_DIR/manifest.json').version")" = "$VERSION"

      - name: Run Android unit tests and assemble preview APK
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR='${{ steps.source.outputs.host_dir }}'
          VERSION='${{ steps.version.outputs.version }}'
          export ORG_GRADLE_PROJECT_DISCORD_APP_ID="$DISCORD_APP_ID"
          gradle --no-daemon --stacktrace -p "$HOST_DIR" :app:testDebugUnitTest :app:assembleDebug
          cp "$HOST_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/GeckoPresence-${VERSION}-Android-debug.apk"

      - name: Generate notices, manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          BRIDGE_DIR='${{ steps.source.outputs.bridge_dir }}'
          cp "$BRIDGE_DIR/THIRD_PARTY_NOTICES.md" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md"
          cp "$BRIDGE_DIR/PREMiD_IMPORT_LOCK.json" "$GITHUB_WORKSPACE/PREMiD_IMPORT_LOCK.json"
          cp "$BRIDGE_DIR/premid-imports.json" "$GITHUB_WORKSPACE/premid-imports.json"
          cat > "$GITHUB_WORKSPACE/BUILD-MANIFEST.json" <<JSON
          {"product":"Gecko Presence","version":"$VERSION","preMiDImportLock":"PREMiD_IMPORT_LOCK.json","android":"preview-or-sdk-enabled","browser":"Gecko MV2","bridgeApi":2,"sourceArchive":"GeckoPresence-Suite-${VERSION}-Source.zip"}
          JSON
          sha256sum "GeckoPresence-${VERSION}-Android-debug.apk" "GeckoPresenceBridge-${VERSION}-unsigned.xpi" BUILD-MANIFEST.json THIRD_PARTY_NOTICES.md PREMiD_IMPORT_LOCK.json premid-imports.json "GeckoPresence-Suite-${VERSION}-Source.zip" > "GeckoPresence-${VERSION}-SHA256SUMS.txt"

      - name: Upload versioned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeckoPresence-0.5.0-build
          path: |
            GeckoPresence-0.5.0-Android-debug.apk
            GeckoPresenceBridge-0.5.0-unsigned.xpi
            GeckoPresence-0.5.0-SHA256SUMS.txt
            BUILD-MANIFEST.json
            THIRD_PARTY_NOTICES.md
            PREMiD_IMPORT_LOCK.json
            premid-imports.json
            GeckoPresence-Suite-0.5.0-Source.zip
          if-no-files-found: error
