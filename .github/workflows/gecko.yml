name: Gecko Presence Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gecko-presence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK and Firefox XPI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
      DISCORD_SDK_AAR_PATH: ${{ vars.DISCORD_SDK_AAR_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail

          test -f GeckoPresenceBridge/package.json
          test -f GeckoPresenceBridge/extension/manifest.json
          test -f GeckoPresenceBridge/THIRD_PARTY_NOTICES.md
          test -f GeckoPresenceBridge/PREMiD_IMPORT_LOCK.json
          test -f GeckoPresenceBridge/premid-imports.json

          test -f GeckoPresenceHost/settings.gradle.kts
          test -f GeckoPresenceHost/app/build.gradle.kts
          test -f GeckoPresenceHost/gradle/wrapper/gradle-wrapper.properties

          echo "Repository layout verified."

      - name: Install dependencies and test extension
        working-directory: GeckoPresenceBridge
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund
          npm run import:premid
          npm test

          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./extension/manifest.json').version")"

          test "$VERSION" = "0.5.0"
          test "$MANIFEST_VERSION" = "$VERSION"
          grep -Fq "versionName = \"$VERSION\"" ../GeckoPresenceHost/app/build.gradle.kts

          echo "GPB_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Lint Firefox extension
        working-directory: GeckoPresenceBridge
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/web-ext lint --source-dir extension

      - name: Package XPI and bundle Android assets
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE_DIR="$GITHUB_WORKSPACE/GeckoPresenceBridge"
          HOST_DIR="$GITHUB_WORKSPACE/GeckoPresenceHost"
          ASSET_DIR="$HOST_DIR/app/src/main/assets/gpb-extension"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a "$BRIDGE_DIR/extension/." "$ASSET_DIR/"

          (
            cd "$BRIDGE_DIR/extension"
            zip -qr \
              "$GITHUB_WORKSPACE/dist/GeckoPresenceBridge-${GPB_VERSION}-unsigned.xpi" \
              .
          )

          test -s "$GITHUB_WORKSPACE/dist/GeckoPresenceBridge-${GPB_VERSION}-unsigned.xpi"
          test -f "$ASSET_DIR/manifest.json"

      - name: Configure optional Discord SDK
        shell: bash
        run: |
          set -euo pipefail

          AAR_TARGET="$GITHUB_WORKSPACE/GeckoPresenceHost/app/libs/discord_partner_sdk.aar"
          mkdir -p "$(dirname "$AAR_TARGET")"

          if [[ -n "${DISCORD_SDK_AAR_PATH:-}" ]]; then
            AAR_SOURCE="$GITHUB_WORKSPACE/$DISCORD_SDK_AAR_PATH"

            if [[ ! -f "$AAR_SOURCE" ]]; then
              echo "Configured Discord SDK AAR not found: $AAR_SOURCE" >&2
              exit 1
            fi

            cp "$AAR_SOURCE" "$AAR_TARGET"

          elif [[ -f "$GITHUB_WORKSPACE/discord_partner_sdk.aar" ]]; then
            cp "$GITHUB_WORKSPACE/discord_partner_sdk.aar" "$AAR_TARGET"
          fi

          if [[ -f "$AAR_TARGET" && -n "${DISCORD_APP_ID:-}" ]]; then
            echo "Discord SDK inputs are present."
          else
            echo "Building preview mode without the official Discord SDK."
          fi

      - name: Run Android tests and build debug APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
        run: |
          set -euo pipefail

          HOST_DIR="$GITHUB_WORKSPACE/GeckoPresenceHost"
          APK="$HOST_DIR/app/build/outputs/apk/debug/app-debug.apk"

          gradle --no-daemon --stacktrace \
            -p "$HOST_DIR" \
            :app:testDebugUnitTest \
            :app:assembleDebug

          test -s "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/dist/GeckoPresence-${GPB_VERSION}-Android-debug.apk"

      - name: Generate build manifest and checksums
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE_DIR="$GITHUB_WORKSPACE/GeckoPresenceBridge"
          HOST_DIR="$GITHUB_WORKSPACE/GeckoPresenceHost"
          DIST_DIR="$GITHUB_WORKSPACE/dist"

          cp "$BRIDGE_DIR/THIRD_PARTY_NOTICES.md" "$DIST_DIR/"
          cp "$BRIDGE_DIR/PREMiD_IMPORT_LOCK.json" "$DIST_DIR/"
          cp "$BRIDGE_DIR/premid-imports.json" "$DIST_DIR/"

          ANDROID_MODE="preview"

          if [[ -f "$HOST_DIR/app/libs/discord_partner_sdk.aar" ]] &&
             [[ "$DISCORD_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            ANDROID_MODE="sdk-enabled"
          fi

          cat > "$DIST_DIR/BUILD-MANIFEST.json" <<JSON
          {
            "product": "Gecko Presence",
            "version": "$GPB_VERSION",
            "sourceCommit": "$GITHUB_SHA",
            "androidMode": "$ANDROID_MODE",
            "browser": "Firefox Gecko MV2",
            "bridgeApi": 2
          }
          JSON

          cd "$DIST_DIR"

          sha256sum \
            "GeckoPresence-${GPB_VERSION}-Android-debug.apk" \
            "GeckoPresenceBridge-${GPB_VERSION}-unsigned.xpi" \
            BUILD-MANIFEST.json \
            THIRD_PARTY_NOTICES.md \
            PREMiD_IMPORT_LOCK.json \
            premid-imports.json \
            > "GeckoPresence-${GPB_VERSION}-SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GeckoPresence-0.5.0-build
          path: |
            dist/GeckoPresence-0.5.0-Android-debug.apk
            dist/GeckoPresenceBridge-0.5.0-unsigned.xpi
            dist/GeckoPresence-0.5.0-SHA256SUMS.txt
            dist/BUILD-MANIFEST.json
            dist/THIRD_PARTY_NOTICES.md
            dist/PREMiD_IMPORT_LOCK.json
            dist/premid-imports.json
          if-no-files-found: error
          retention-days: 14
