name: Gecko Android CI

on:
  push:
    branches: [main, gecko-0.6.6, development]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: gecko-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Assemble Android flavors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Platform 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Assemble both Android flavors
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleSecureDebug \
            :app:assembleAutomationDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gecko-presence-0.6.6-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
