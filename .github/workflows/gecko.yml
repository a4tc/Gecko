
name: Gecko Presence 0.4.0 — Android APK + Firefox XPI

on:
  push:
    paths:
      - '.github/workflows/gecko.yml'
      - 'GeckoPresence-Suite-*-Source.zip'
  pull_request:
    paths:
      - '.github/workflows/gecko.yml'
      - 'GeckoPresence-Suite-*-Source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-suite:
    name: Test and build GPB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
      DISCORD_SDK_AAR_PATH: ${{ vars.DISCORD_SDK_AAR_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Validate and extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ARCHIVES=(GeckoPresence-Suite-*-Source.zip)

          if [[ ${#ARCHIVES[@]} -ne 1 ]]; then
            echo "Expected exactly one GeckoPresence-Suite-*-Source.zip at repository root; found ${#ARCHIVES[@]}." >&2
            printf 'Found: %s\n' "${ARCHIVES[@]}" >&2
            echo 'Root files:' >&2
            ls -la >&2
            exit 1
          fi

          SOURCE_ZIP="${ARCHIVES[0]}"
          echo "Using source archive: $SOURCE_ZIP"
          unzip -tq "$SOURCE_ZIP"

          rm -rf _gpb_work
          mkdir -p _gpb_work
          unzip -q "$SOURCE_ZIP" -d _gpb_work

          HOST_SETTINGS="$(find _gpb_work -type f -path '*/GeckoPresenceHost/settings.gradle.kts' -print -quit)"
          if [[ -z "$HOST_SETTINGS" ]]; then
            echo 'GeckoPresenceHost/settings.gradle.kts was not found in the source ZIP.' >&2
            find _gpb_work -maxdepth 7 -print >&2
            exit 1
          fi

          HOST_DIR="${HOST_SETTINGS%/settings.gradle.kts}"
          SUITE_DIR="$(dirname "$HOST_DIR")"
          BRIDGE_DIR="$SUITE_DIR/GeckoPresenceBridge"

          if [[ ! -f "$BRIDGE_DIR/package.json" || ! -d "$BRIDGE_DIR/src" || ! -f "$BRIDGE_DIR/extension/manifest.json" ]]; then
            echo 'GeckoPresenceBridge source or extension files are missing beside GeckoPresenceHost.' >&2
            find "$SUITE_DIR" -maxdepth 4 -print >&2 || true
            exit 1
          fi

          MAIN_ACTIVITY="$HOST_DIR/app/src/main/java/app/geckopresence/host/MainActivity.kt"
          if [[ ! -f "$MAIN_ACTIVITY" ]] || ! grep -Fq 'import android.widget.FrameLayout' "$MAIN_ACTIVITY" || ! grep -Fq 'FrameLayout.LayoutParams(-1, -2)' "$MAIN_ACTIVITY"; then
            echo 'The source ZIP does not contain the expected FrameLayout Kotlin fix. Replace the ZIP with the corrected source archive.' >&2
            exit 1
          fi

          echo "host_dir=$HOST_DIR" >> "$GITHUB_OUTPUT"
          echo "bridge_dir=$BRIDGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare optional Discord Social SDK
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR='${{ steps.source.outputs.host_dir }}'
          AAR_TARGET="$HOST_DIR/app/libs/discord_partner_sdk.aar"
          mkdir -p "$(dirname "$AAR_TARGET")"

          if [[ -n "${DISCORD_SDK_AAR_PATH:-}" ]]; then
            AAR_SOURCE="$GITHUB_WORKSPACE/$DISCORD_SDK_AAR_PATH"
            if [[ ! -f "$AAR_SOURCE" ]]; then
              echo "DISCORD_SDK_AAR_PATH is set, but the file does not exist: $DISCORD_SDK_AAR_PATH" >&2
              exit 1
            fi
            if [[ -z "${DISCORD_APP_ID:-}" ]]; then
              echo 'DISCORD_APP_ID must also be set when supplying the SDK AAR.' >&2
              exit 1
            fi
            cp "$AAR_SOURCE" "$AAR_TARGET"
            sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
            echo 'Official Discord SDK AAR and Application ID found; SDK build enabled.'
          else
            echo 'Preview build: no Discord SDK AAR configured. Discord connection will not be enabled in this APK.'
          fi

      - name: Install extension dependencies and run tests
        working-directory: ${{ steps.source.outputs.bridge_dir }}
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Lint Gecko extension (diagnostic)
        continue-on-error: true
        working-directory: ${{ steps.source.outputs.bridge_dir }}
        run: npx web-ext lint --source-dir extension

      - name: Bundle extension into APK and package Firefox XPI
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR='${{ steps.source.outputs.host_dir }}'
          BRIDGE_DIR='${{ steps.source.outputs.bridge_dir }}'
          ASSET_DIR="$HOST_DIR/app/src/main/assets/gpb-extension"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a "$BRIDGE_DIR/extension/." "$ASSET_DIR/"
          (cd "$BRIDGE_DIR/extension" && zip -q -r "$GITHUB_WORKSPACE/GeckoPresenceBridge-0.4.0-unsigned.xpi" . -x '*/.DS_Store')

          test -f "$ASSET_DIR/manifest.json"
          test -f "$ASSET_DIR/background.js"
          test -f "$ASSET_DIR/content/generic-media.js"
          test -s "$GITHUB_WORKSPACE/GeckoPresenceBridge-0.4.0-unsigned.xpi"

      - name: Compile, test and assemble Android APK
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR='${{ steps.source.outputs.host_dir }}'

          if [[ -f "$HOST_DIR/app/libs/discord_partner_sdk.aar" && -n "${DISCORD_APP_ID:-}" ]]; then
            export ORG_GRADLE_PROJECT_DISCORD_APP_ID="$DISCORD_APP_ID"
          else
            export ORG_GRADLE_PROJECT_DISCORD_APP_ID=''
          fi

          gradle --no-daemon --stacktrace --console=plain -p "$HOST_DIR" \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:assembleDebug

          APK="$HOST_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/GeckoPresence-0.4.0-debug.apk"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            GeckoPresence-0.4.0-debug.apk \
            GeckoPresenceBridge-0.4.0-unsigned.xpi \
            > GeckoPresence-0.4.0-SHA256SUMS.txt

      - name: Upload APK, XPI and checksums
        uses: actions/upload-artifact@v4
        with:
          name: GeckoPresence-0.4.0-build
          path: |
            GeckoPresence-0.4.0-debug.apk
            GeckoPresenceBridge-0.4.0-unsigned.xpi
            GeckoPresence-0.4.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

