name: Gecko Android CI

on:
  push:
    branches: [main, gecko-0.6.6]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: gecko-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Test and assemble Android flavors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin CLI 2.0.21
        id: cache-kotlinc
        uses: actions/cache@v4
        with:
          path: ~/kotlin-2.0.21
          key: ${{ runner.os }}-kotlin-cli-2.0.21

      - name: Install Kotlin CLI 2.0.21 for standalone source tests
        if: steps.cache-kotlinc.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          echo "0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a  /tmp/kotlin-compiler.zip" | sha256sum -c -
          unzip -q /tmp/kotlin-compiler.zip -d "$HOME/kotlin-2.0.21"

      - name: Add Kotlin CLI to PATH
        run: echo "$HOME/kotlin-2.0.21/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Platform 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test Cloudflare artwork Worker
        working-directory: gecko-cloudflare-artwork-worker
        run: |
          npm install --no-audit --no-fund --include=dev
          npm test
          npm run typecheck

      - name: Run pure Kotlin source and security checks
        run: |
          bash scripts/test-core.sh
          bash scripts/test-imgur-upload-dynamic.sh
          bash scripts/verify-source.sh

      - name: Run Android unit tests and assemble both flavors
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testSecureDebugUnitTest \
            :app:testAutomationDebugUnitTest \
            :app:assembleSecureDebug \
            :app:assembleAutomationDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gecko-presence-0.6.6-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
