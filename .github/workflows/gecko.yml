name: Gecko Presence 0.5.0 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and Firefox XPI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate extracted Gecko Presence source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"

          GRADLEW="$(find "$ROOT" -type f -name gradlew \
            -not -path '*/.git/*' -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo '::error::Could not find gradlew. Make sure the extracted Android source is committed to this repository.'
            echo 'Repository files:'
            find "$ROOT" -maxdepth 4 -type f | head -200
            exit 1
          fi
          ANDROID_DIR="$(dirname "$GRADLEW")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found Android Gradle project: $ANDROID_DIR"

          MANIFEST="$(node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.GITHUB_WORKSPACE;
          const skip = new Set(['.git', 'node_modules', '.gradle', 'build']);
          const found = [];
          function walk(dir) {
            let entries;
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); }
            catch { return; }
            for (const entry of entries) {
              if (entry.isDirectory()) {
                if (!skip.has(entry.name)) walk(path.join(dir, entry.name));
              } else if (entry.isFile() && entry.name === 'manifest.json') {
                const file = path.join(dir, entry.name);
                try {
                  const m = JSON.parse(fs.readFileSync(file, 'utf8'));
                  if (![2, 3].includes(m.manifest_version)) continue;
                  let score = 1;
                  if (/gecko\s*presence/i.test(m.name || '')) score += 100;
                  if (m.browser_specific_settings || m.applications) score += 20;
                  if (m.background || m.action || m.browser_action) score += 5;
                  found.push({ file, score });
                } catch {}
              }
            }
          }
          walk(root);
          found.sort((a, b) => b.score - a.score);
          if (found.length) process.stdout.write(found[0].file);
          NODE
          )"
          if [ -z "$MANIFEST" ]; then
            echo '::error::Could not locate the Firefox WebExtension manifest.json in the extracted source.'
            exit 1
          fi
          EXT_DIR="$(dirname "$MANIFEST")"
          echo "EXT_DIR=$EXT_DIR" >> "$GITHUB_ENV"
          echo "Found WebExtension manifest: $MANIFEST"

          # Find the nearest ancestor package.json for this extension.
          PKG_DIR="$(node - "$EXT_DIR" "$ROOT" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          let dir = path.resolve(process.argv[2]);
          const root = path.resolve(process.argv[3]);
          let fallback = '';
          while (dir.startsWith(root)) {
            const file = path.join(dir, 'package.json');
            if (fs.existsSync(file)) {
              if (!fallback) fallback = dir;
              try {
                const p = JSON.parse(fs.readFileSync(file, 'utf8'));
                if (p.scripts && p.scripts.build) { process.stdout.write(dir); process.exit(0); }
              } catch {}
            }
            if (dir === root) break;
            dir = path.dirname(dir);
          }
          if (fallback) process.stdout.write(fallback);
          NODE
          )"
          if [ -n "$PKG_DIR" ]; then
            echo "EXT_PACKAGE_DIR=$PKG_DIR" >> "$GITHUB_ENV"
            echo "Found extension package: $PKG_DIR"
          else
            echo 'EXT_PACKAGE_DIR=' >> "$GITHUB_ENV"
            echo 'No package.json found in extension ancestors; will package the existing extension files.'
          fi

      - name: Build and package Firefox XPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpb-output"

          if [ -n "${EXT_PACKAGE_DIR:-}" ]; then
            cd "$EXT_PACKAGE_DIR"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run import:premid --if-present
            if node -e "const p=require('./package.json');process.exit(p.scripts?.build?0:1)"; then
              npm run build
            else
              echo '::warning::No npm build script found; packaging the existing extension files.'
            fi
            npm test --if-present

            if [ -x node_modules/.bin/web-ext ]; then
              node_modules/.bin/web-ext lint --source-dir "$EXT_DIR"
            fi
          fi

          test -f "$EXT_DIR/manifest.json" || {
            echo '::error::Extension manifest disappeared or is not at the detected extension directory.'
            exit 1
          }
          cd "$EXT_DIR"
          zip -qr "$RUNNER_TEMP/gpb-output/GeckoPresenceBridge-0.5.0-unsigned.xpi" . \
            -x '*/node_modules/*' 'node_modules/*' '*/.git/*' '.git/*' \
               '*/.DS_Store' '.DS_Store' '*/package-lock.json' 'package-lock.json'
          unzip -t "$RUNNER_TEMP/gpb-output/GeckoPresenceBridge-0.5.0-unsigned.xpi"

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

          APK="$(find "$ANDROID_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo '::error::Gradle completed but no debug APK was found.'
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/gpb-output/GeckoPresence-0.5.0-Android-debug.apk"

      - name: Generate checksums and build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gpb-output"
          test -s GeckoPresenceBridge-0.5.0-unsigned.xpi
          test -s GeckoPresence-0.5.0-Android-debug.apk
          sha256sum GeckoPresence-0.5.0-Android-debug.apk \
            GeckoPresenceBridge-0.5.0-unsigned.xpi > SHA256SUMS.txt
          {
            echo 'Gecko Presence 0.5.0 build'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            ls -lh
          } > BUILD-MANIFEST.txt

      - name: Upload APK and XPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeckoPresence-0.5.0-build
          path: ${{ runner.temp }}/gpb-output/*
          if-no-files-found: error
          retention-days: 30

