name: Gecko Presence Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gecko-presence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build native Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || '1569772369344602173' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Verify native-only source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f GeckoPresenceHost/settings.gradle.kts
          test -f GeckoPresenceHost/app/build.gradle.kts
          test -f GeckoPresenceHost/app/src/main/java/app/geckopresence/host/PresenceEngineService.kt
          test -f GeckoPresenceHost/app/src/main/java/app/geckopresence/host/BrowserAccessibilityService.kt
          test -f GeckoPresenceHost/app/src/main/java/app/geckopresence/host/MediaSessionPresenceTracker.kt
          if grep -R -nE 'BridgeHttpServer|SecureStore|(^|[^[:alnum:]_])XPI([^[:alnum:]_]|$)|Firefox extension runtime' GeckoPresenceHost/app/src/main; then
            echo "Legacy browser bridge code remains in Android runtime." >&2
            exit 1
          fi

      - name: Verify source contract and run core tests
        working-directory: GeckoPresenceHost
        run: sh scripts/verify-source.sh

      - name: Download and verify Discord Partner SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SDK_DIR="$RUNNER_TEMP/gecko-sdk"
          AAR_TARGET="$GITHUB_WORKSPACE/GeckoPresenceHost/app/libs/discord_partner_sdk.aar"
          mkdir -p "$SDK_DIR" "$(dirname "$AAR_TARGET")"
          gh release download sdk-1.10.19337 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern discord_partner_sdk.aar \
            --dir "$SDK_DIR"
          AAR_SOURCE="$SDK_DIR/discord_partner_sdk.aar"
          test -s "$AAR_SOURCE"
          printf '%s  %s\n' \
            'b1b2491f1e1848c79fd6f1986d5aa1e0c8019e88a6e62c7be06b89e8e4870933' \
            "$AAR_SOURCE" | sha256sum --check -
          unzip -t "$AAR_SOURCE"
          cp "$AAR_SOURCE" "$AAR_TARGET"
          echo "Discord SDK AAR verified and staged."

      - name: Test and assemble APK
        working-directory: GeckoPresenceHost
        env:
          ORG_GRADLE_PROJECT_DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || '1569772369344602173' }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/GeckoPresence-0.6.0-Android-debug.apk

      - name: Generate build manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          HOST_DIR="$GITHUB_WORKSPACE/GeckoPresenceHost"
          SDK_MODE="preview"
          if [[ -f "$HOST_DIR/app/libs/discord_partner_sdk.aar" && "${DISCORD_APP_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            SDK_MODE="direct-rpc"
          fi
          cat > dist/BUILD-MANIFEST.json <<JSON
          {
            "product": "Gecko Presence",
            "version": "0.6.0",
            "androidMode": "$SDK_MODE",
            "runtime": "native-android",
            "browserDetection": "optional-accessibility-address-field",
            "mediaDetection": "optional-notification-listener-media-sessions"
          }
          JSON
          cd dist
          sha256sum GeckoPresence-0.6.0-Android-debug.apk BUILD-MANIFEST.json > GeckoPresence-0.6.0-SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GeckoPresence-0.6.0-Android
          path: |
            dist/GeckoPresence-0.6.0-Android-debug.apk
            dist/BUILD-MANIFEST.json
            dist/GeckoPresence-0.6.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
