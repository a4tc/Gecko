      - name: Unzip GeckoPresence bundle and source
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$(find . -maxdepth 1 -type f \
            -iname 'GeckoPresence-*-DOWNLOAD-BUNDLE*.zip' -print -quit)"
          if [[ -z "$BUNDLE" ]]; then
            echo "Download bundle ZIP not found in the repository checkout." >&2
            exit 1
          fi

          mkdir -p _gpb_bundle _gpb_work
          unzip -tq "$BUNDLE"
          unzip -oq "$BUNDLE" -d _gpb_bundle

          SOURCE="$(find _gpb_bundle -type f \
            -iname 'GeckoPresence-Suite-*-Source*.zip' -print -quit)"
          if [[ -z "$SOURCE" ]]; then
            echo "Source ZIP not found inside the download bundle." >&2
            exit 1
          fi

          unzip -tq "$SOURCE"
          unzip -oq "$SOURCE" -d _gpb_work
