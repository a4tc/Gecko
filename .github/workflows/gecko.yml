name: Unzip GeckoPresence bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract bundle and source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t bundles < <(
            find . -type f -iname 'GeckoPresence-*-DOWNLOAD-BUNDLE*.zip' \
              -not -path './.git/*' \
              -not -path './_gpb_bundle/*' \
              -not -path './_gpb_work/*' | sort
          )

          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one download bundle; found ${#bundles[@]}." >&2
            printf '%s\n' "${bundles[@]}" >&2
            exit 1
          fi

          mkdir -p _gpb_bundle _gpb_work
          unzip -tq "${bundles[0]}"
          unzip -oq "${bundles[0]}" -d _gpb_bundle

          mapfile -t sources < <(
            find _gpb_bundle -type f \
              -iname 'GeckoPresence-Suite-*-Source*.zip' | sort
          )

          if [[ ${#sources[@]} -ne 1 ]]; then
            echo "Expected exactly one source ZIP in the bundle; found ${#sources[@]}." >&2
            find _gpb_bundle -type f -iname '*.zip' -print | sort >&2 || true
            exit 1
          fi

          unzip -tq "${sources[0]}"
          unzip -oq "${sources[0]}" -d _gpb_work

          echo "Extracted source files:"
          find _gpb_work -maxdepth 4 -type f | sort | head -200

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: GeckoPresence-extracted-source
          path: _gpb_work/
          if-no-files-found: error
          retention-days: 7
